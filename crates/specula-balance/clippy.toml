# Determinism lints for simulation crates (foundation F2, docs/design/DETERMINISM.md).
# The same list is in every simulation crate's clippy.toml (crates/specula/tests/determinism_lints.rs
# checks they stay in step). Justify a deliberate use with #[allow(clippy::disallowed_..., reason = "...")].
disallowed-types = [
    { path = "std::collections::HashMap", reason = "random iteration order breaks determinism; use BTreeMap or a Vec indexed by id" },
    { path = "std::collections::HashSet", reason = "random iteration order breaks determinism; use BTreeSet or a Vec<bool> indexed by id" },
    { path = "std::collections::hash_map::RandomState", reason = "seeded per process: hashes differ between runs" },
]
disallowed-methods = [
    # Platform maths (libm): results differ between msvc, gnu and OSes. Use specula_core::dmath.
    { path = "f32::sin", reason = "platform libm; use dmath::sin" },
    { path = "f32::cos", reason = "platform libm; use dmath::cos" },
    { path = "f32::tan", reason = "platform libm; use dmath::tan" },
    { path = "f32::sin_cos", reason = "platform libm; use dmath::sin_cos" },
    { path = "f32::asin", reason = "platform libm; use dmath::asin" },
    { path = "f32::acos", reason = "platform libm; use dmath::acos" },
    { path = "f32::atan", reason = "platform libm; use dmath::atan" },
    { path = "f32::atan2", reason = "platform libm; use dmath::atan2" },
    { path = "f32::exp", reason = "platform libm; use dmath::exp" },
    { path = "f32::exp2", reason = "platform libm; use dmath::exp2" },
    { path = "f32::exp_m1", reason = "platform libm; add it to dmath first" },
    { path = "f32::ln", reason = "platform libm; use dmath::ln" },
    { path = "f32::log", reason = "platform libm; use dmath::ln and a division" },
    { path = "f32::log2", reason = "platform libm; use dmath::log2" },
    { path = "f32::log10", reason = "platform libm; add it to dmath first" },
    { path = "f32::ln_1p", reason = "platform libm; add it to dmath first" },
    { path = "f32::powf", reason = "platform libm; use dmath::pow" },
    { path = "f32::powi", reason = "compiler-rt, folded differently by LLVM; multiply, or use dmath::pow" },
    { path = "f32::hypot", reason = "platform libm; use dmath::hypot" },
    { path = "f32::cbrt", reason = "platform libm; add it to dmath first" },
    { path = "f32::sinh", reason = "platform libm; add it to dmath first" },
    { path = "f32::cosh", reason = "platform libm; add it to dmath first" },
    { path = "f32::tanh", reason = "platform libm; add it to dmath first" },
    { path = "f32::asinh", reason = "platform libm; add it to dmath first" },
    { path = "f32::acosh", reason = "platform libm; add it to dmath first" },
    { path = "f32::atanh", reason = "platform libm; add it to dmath first" },
    { path = "f32::floor", reason = "libm on some targets (mingw's roundf is wrong); use dmath::floor" },
    { path = "f32::ceil", reason = "libm on some targets; use dmath::ceil" },
    { path = "f32::round", reason = "mingw's roundf rounds 0.49999997 to 1; use dmath::round" },
    { path = "f32::round_ties_even", reason = "libm on some targets; use dmath::round_ties_even" },
    { path = "f32::trunc", reason = "libm on some targets; use dmath::trunc" },
    { path = "f32::fract", reason = "libm on some targets; use dmath::fract" },
    { path = "f32::mul_add", reason = "fused on some targets, a libm call on others; write a * b + c" },
    { path = "f64::sin", reason = "platform libm (mingw's is 11,000 ulp off for big arguments); use dmath::sin_f64" },
    { path = "f64::cos", reason = "platform libm; use dmath::cos_f64" },
    { path = "f64::tan", reason = "platform libm; use dmath::tan_f64" },
    { path = "f64::sin_cos", reason = "platform libm; use dmath::sin_cos_f64" },
    { path = "f64::asin", reason = "platform libm; use dmath::asin_f64" },
    { path = "f64::acos", reason = "platform libm; use dmath::acos_f64" },
    { path = "f64::atan", reason = "platform libm; use dmath::atan_f64" },
    { path = "f64::atan2", reason = "platform libm; use dmath::atan2_f64" },
    { path = "f64::exp", reason = "platform libm; use dmath::exp_f64" },
    { path = "f64::exp2", reason = "platform libm; use dmath::exp2_f64" },
    { path = "f64::exp_m1", reason = "platform libm; add it to dmath first" },
    { path = "f64::ln", reason = "platform libm; use dmath::ln_f64" },
    { path = "f64::log", reason = "platform libm; use dmath::ln_f64 and a division" },
    { path = "f64::log2", reason = "platform libm; use dmath::log2_f64" },
    { path = "f64::log10", reason = "platform libm; add it to dmath first" },
    { path = "f64::ln_1p", reason = "platform libm; add it to dmath first" },
    { path = "f64::powf", reason = "platform libm; add pow_f64 to dmath first" },
    { path = "f64::powi", reason = "compiler-rt, folded differently by LLVM; multiply instead" },
    { path = "f64::hypot", reason = "platform libm; use dmath::hypot_f64" },
    { path = "f64::cbrt", reason = "platform libm; add it to dmath first" },
    { path = "f64::sinh", reason = "platform libm; add it to dmath first" },
    { path = "f64::cosh", reason = "platform libm; add it to dmath first" },
    { path = "f64::tanh", reason = "platform libm; add it to dmath first" },
    { path = "f64::asinh", reason = "platform libm; add it to dmath first" },
    { path = "f64::acosh", reason = "platform libm; add it to dmath first" },
    { path = "f64::atanh", reason = "platform libm; add it to dmath first" },
    { path = "f64::floor", reason = "libm on some targets; use dmath::floor_f64" },
    { path = "f64::ceil", reason = "libm on some targets; use dmath::ceil_f64" },
    { path = "f64::round", reason = "libm on some targets; use dmath::round_f64" },
    { path = "f64::round_ties_even", reason = "libm on some targets; use dmath::round_ties_even_f64" },
    { path = "f64::trunc", reason = "libm on some targets; use dmath::trunc_f64" },
    { path = "f64::fract", reason = "libm on some targets; use dmath::fract_f64" },
    { path = "f64::mul_add", reason = "fused on some targets, a libm call on others; write a * b + c" },
    # Wall-clock time: the tick number is the only clock the simulation sees.
    { path = "std::time::Instant::now", reason = "wall-clock time in the simulation; use the tick (profiling or a budget outside the results: allow it with a reason)" },
    { path = "std::time::SystemTime::now", reason = "wall-clock time in the simulation; use the tick" },
    # Thread timing: work split across threads must merge in index order (rule 7).
    { path = "std::thread::spawn", reason = "thread timing in the simulation; split work by index and merge in index order (allow it with a reason)" },
    { path = "std::thread::scope", reason = "thread timing in the simulation; split work by index and merge in index order (allow it with a reason)" },
]

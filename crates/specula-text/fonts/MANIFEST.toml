# The fonts Specula ships, and where each came from (owner, 2026-10-22: SIL OFL only).
#
# Every bundled file has an entry: the licence and its text beside the font, the upstream source
# (the Google Fonts copy and the foundry repository with its commit), the version from the
# font's own name table, its size and SHA-256. `crates/specula-text/tests/bundled_fonts.rs`
# checks sizes, licence files and coverage; `scripts/text_check.py` checks the SHA-256 sums.
# This is the start of M6's "licence metadata on every asset".
#
# Files are byte-for-byte the upstream release (no subsetting: we only subset with our own code).

[[font]]
file = "alegreya-sans/AlegreyaSans-Regular.ttf"
family = "Alegreya Sans"
style = "Regular"
role = "ui"
licence = "OFL-1.1"
licence_file = "alegreya-sans/OFL.txt"
copyright = "Copyright 2013 The Alegreya Sans Project Authors"
source = "https://github.com/google/fonts/blob/main/ofl/alegreyasans/AlegreyaSans-Regular.ttf"
upstream = "https://github.com/huertatipografica/Alegreya-Sans"
upstream_commit = "030b9ac01fd9bcaccac0ebc8010283175f9ced4e"
version = "Version 2.004; ttfautohint (v1.6)"
bytes = 263804
sha256 = "8fab634196007afca839f1e5a6fb300976daff55d8528b590ef032f01b14ea10"
scripts = ["latin", "latin-ext", "cyrillic", "cyrillic-ext", "greek", "greek-ext", "vietnamese"]
outlines = "glyf"
fetched = "2026-11-06"


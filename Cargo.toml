[workspace]
resolver = "2"
members = [
    "crates/specula-sys",
    "crates/specula-core",
    "crates/specula-model",
    "crates/specula-platform",
    "crates/specula-input",
    "crates/specula-gpu",
    "crates/specula-protocol",
    "crates/specula-text",
    "crates/specula-audio",
    "crates/specula",
    "games/sepulcra",
    "games/sepulcra-app",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/IronAdamant/Specula"
authors = ["Specula contributors"]
rust-version = "1.85"

# Zero third-party crates: only path dependencies on workspace members are allowed.
# Enforced by crates/specula/tests/zero_dep.rs (runs in CI).
[workspace.dependencies]
specula-sys = { path = "crates/specula-sys" }
specula-core = { path = "crates/specula-core" }
specula-model = { path = "crates/specula-model" }
specula-platform = { path = "crates/specula-platform" }
specula-input = { path = "crates/specula-input" }
specula-gpu = { path = "crates/specula-gpu" }
specula-protocol = { path = "crates/specula-protocol" }
specula-text = { path = "crates/specula-text" }
specula-audio = { path = "crates/specula-audio" }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

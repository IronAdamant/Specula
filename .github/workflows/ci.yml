name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -Dwarnings
    strategy:
      fail-fast: false
      matrix:
        # Windows (MSVC host) and Linux: platform/GPU crates must still compile on Linux (they report
        # "unsupported" at runtime there). GPU/window tests skip without a GPU and a desktop.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  android-check:
    # F6 (portable by design): every crate must at least type-check for a mobile ARM target, so
    # nothing quietly assumes Windows, x86 or a desktop. `cargo check` needs only the target's
    # std, not the Android NDK (nothing is linked).
    name: check (aarch64-linux-android)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Check
        run: cargo check --workspace --all-targets --target aarch64-linux-android

  windows-gnu:
    # The toolchain development uses: windows-gnu with the Rust toolchain's own linker and raw-dylib
    # imports (AGENTS.md rules 2–3). An env RUSTFLAGS replaces .cargo/config.toml rustflags, so the
    # link-self-contained flag is repeated here.
    name: test (windows-gnu, self-contained linker)
    runs-on: windows-latest
    env:
      RUSTFLAGS: -Dwarnings -C link-self-contained=yes
    steps:
      - uses: actions/checkout@v5
      - name: Install stable-x86_64-pc-windows-gnu
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component clippy
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

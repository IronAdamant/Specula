name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A build that is thrown away needs no debug information and no incremental state: without
  # them it is quicker and its folder is small enough to keep between runs.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

# The Rust version is pinned (rust-toolchain.toml; docs/ROADMAP.md M6, "A Rust version policy").
# Every job installs that version by number, and tools/examen's tests hold the numbers here to
# the file. The newest stable is tried by newest.yml, on a schedule, and blocks nothing.

jobs:
  changes:
    # What this push or pull request changed, as a tier (tools/examen/src/changed.rs). A change
    # to documents only runs the document guards and not the builds below.
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.what.outputs.code }}
      tier: ${{ steps.what.outputs.tier }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust 1.100.0
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy
      # A push to main is measured from the last commit of main whose builds and tests all
      # passed (the `green` job below writes it), not from the commit before the push: a push of
      # documents on top of a push that failed would otherwise skip the builds and go green over
      # a broken main. With no such commit known (the first run, a marker that expired), a push
      # runs everything. A pull request is measured from the commit it is based on.
      - uses: actions/cache/restore@v4
        if: ${{ github.event_name == 'push' }}
        with:
          path: ${{ runner.temp }}/last-green
          key: last-green-${{ github.sha }}
          restore-keys: last-green-
      - name: What changed
        id: sized
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            BASE="$PR_BASE"
          else
            BASE="$(cat "$RUNNER_TEMP/last-green/sha" 2>/dev/null || true)"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "measured from: ${BASE:-no commit (everything runs)}"
          cargo run -q -p specula-examen -- changed --base "$BASE" --github-output
      # The one thing the tool is not asked. A change to the tool, or to these workflows, would
      # otherwise be sized by itself: it always runs everything, whatever the tool it brings
      # says of it.
      - name: The tooling and the workflows are never sized by themselves
        id: what
        env:
          BASE: ${{ steps.sized.outputs.base }}
          SIZED: ${{ steps.sized.outputs.code }}
          TIER: ${{ steps.sized.outputs.tier }}
        run: |
          code="$SIZED"
          if [ "$code" != true ]; then
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              code=true
            elif git diff --no-renames --name-only "$BASE" HEAD -- tools/examen .github | grep -q .; then
              code=true
            fi
          fi
          [ "$code" = true ] || code=false
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "builds and tests run: $code (the tool said $TIER)"

  docs:
    # The document guards (links, private paths, line endings) and the tooling's own tests:
    # every run, whatever changed. They build in seconds.
    name: documents and tooling
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.100.0
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy
      - name: Test
        run: cargo test -p specula-examen --no-fail-fast

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -Dwarnings
    strategy:
      fail-fast: false
      matrix:
        # Windows (MSVC host) and Linux: platform/GPU crates must still compile on Linux (they report
        # "unsupported" at runtime there). GPU/window tests skip without a GPU and a desktop.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust 1.100.0
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy
      # The last passing run's build folder, with the commit it was built at. Cargo tells a
      # changed source by its time, and a fresh checkout gives every file the time of the
      # checkout, so `examen kept` gives the files that have not changed since that commit an
      # old time; the ones that changed keep theirs and are built again. When the commit is not
      # known to git, or a manifest, a lint file or a workflow differs, nothing is kept: the
      # folder is cleared and everything is built (tools/examen/src/kept.rs). (The tool is built
      # in a folder of its own: built in `target` before the times are set, it would build
      # specula-core again there, and with it everything that depends on it.) The folder is
      # saved by pushes to main only, and read by every run.
      - uses: actions/cache/restore@v4
        with:
          path: target
          key: target-${{ matrix.os }}-test-1.100.0-${{ github.sha }}
          restore-keys: target-${{ matrix.os }}-test-1.100.0-
      - name: Keep what the last build still has right
        run: cargo run -q -p specula-examen --target-dir target-tools -- kept --built-at target/built-at --clear target
      - name: Build
        id: build
        run: cargo build --workspace --all-targets
      # Every test binary runs, whatever fails before it: M5's first push failed here on one
      # package, its fix on the next one, which the first failure had kept from running.
      - name: Test
        run: cargo test --workspace --no-fail-fast
      # (Clippy runs whatever the tests did, for the same reason; not on a tree that didn't build.)
      - name: Clippy (Linux, the cfg(not(windows)) side)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      # (Reached only when every step before it passed.)
      - name: Say which commit this build folder is of
        if: ${{ github.event_name == 'push' }}
        run: cargo run -q -p specula-examen --target-dir target-tools -- kept --mark target/built-at
      - uses: actions/cache/save@v4
        if: ${{ github.event_name == 'push' }}
        with:
          path: target
          key: target-${{ matrix.os }}-test-1.100.0-${{ github.sha }}

  android-check:
    # F6 (portable by design): every crate must at least type-check for a mobile ARM target, so
    # nothing quietly assumes Windows, x86 or a desktop. `cargo check` needs only the target's
    # std, not the Android NDK (nothing is linked).
    name: check (aarch64-linux-android)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.100.0
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy --target aarch64-linux-android
      - name: Check
        run: cargo check --workspace --all-targets --target aarch64-linux-android

  windows-gnu:
    # The toolchain development uses: windows-gnu with the Rust toolchain's own linker and raw-dylib
    # imports (AGENTS.md rules 2–3). An env RUSTFLAGS replaces .cargo/config.toml rustflags, so the
    # link-self-contained flag is repeated here.
    name: test (windows-gnu, self-contained linker)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    env:
      RUSTFLAGS: -Dwarnings -C link-self-contained=yes
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # rust-toolchain.toml names a version and no host, so the host is this machine's default:
      # it is set to windows-gnu before the version is installed.
      - name: Install Rust 1.100.0 for windows-gnu
        run: |
          rustup set default-host x86_64-pc-windows-gnu
          rustup toolchain install 1.100.0 --profile minimal --component clippy
          rustc -vV
      - uses: actions/cache/restore@v4
        with:
          path: target
          key: target-windows-gnu-1.100.0-${{ github.sha }}
          restore-keys: target-windows-gnu-1.100.0-
      - name: Keep what the last build still has right
        run: cargo run -q -p specula-examen --target-dir target-tools -- kept --built-at target/built-at --clear target
      - name: Build
        id: build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace --no-fail-fast
      # A gate must not pass by luck (AGENTS.md, "The gate"): the engine's library tests twice
      # more and once with every worker thread starting late. A test that fails in some runs and
      # passes in others fails the job as flaky, and the gate ends with what it said.
      - name: Repeat, and slow workers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo run -q -p specula-examen -- gate --only repeat,slow --repeat 2 --jobs 4 --no-gpu
      - name: Clippy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Say which commit this build folder is of
        if: ${{ github.event_name == 'push' }}
        run: cargo run -q -p specula-examen --target-dir target-tools -- kept --mark target/built-at
      - uses: actions/cache/save@v4
        if: ${{ github.event_name == 'push' }}
        with:
          path: target
          key: target-windows-gnu-1.100.0-${{ github.sha }}

  green:
    # The commit the next push to main is measured from: written only when a push's builds and
    # tests ran and every job passed. A push of documents alone leaves it where it was.
    name: last green commit
    needs: [changes, docs, test, android-check, windows-gnu, commit-messages]
    if: ${{ github.event_name == 'push' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write the commit
        run: |
          mkdir -p "$RUNNER_TEMP/last-green"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/last-green/sha"
      - uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/last-green
          key: last-green-${{ github.sha }}

  commit-messages:
    # This repository is public: session and share links (claude.ai or any other) don't belong in commit
    # messages. Only the commits this push or pull request adds are checked; history is left as it is.
    name: commit messages (no session links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check new commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # A push's own list of new commits: the fallback when its "before" commit is gone (force push).
          PUSHED: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail
          PATTERN='(https?://)?[^ ]*(claude\.ai/(code|chat|share)|chatgpt\.com/(c|share)/|chat\.openai\.com/(c|share)/|grok\.com/(chat|share)|gemini\.google\.com/(app|share)|g\.co/gemini/share|/session_0[0-9a-z]{20,})'
          git cat-file -e "$HEAD^{commit}"
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            RANGE="$BASE..$HEAD"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$PUSHED" != null ] && [ "$PUSHED" != "[]" ]; then
            # New branch or force push: the payload lists exactly the commits this push added.
            if printf '%s' "$PUSHED" | grep -Eiq "$PATTERN"; then
              echo "::error::session or share links in this push's commit messages:"
              printf '%s' "$PUSHED" | grep -Eio "$PATTERN" || true
              echo "Reword those commits (see AGENTS.md rule 11)."
              exit 1
            fi
            echo "checked the pushed commits from the event payload: no session links"
            exit 0
          else
            # A new branch with nothing listed: check what isn't on main yet.
            RANGE="$(git merge-base origin/main "$HEAD")..$HEAD"
          fi
          COUNT=$(git rev-list --count "$RANGE")
          BAD=0
          for c in $(git rev-list "$RANGE"); do
            if git log -1 --format=%B "$c" | grep -Eiq "$PATTERN"; then
              echo "::error::session or share link in commit $(git log -1 --format='%h %s' "$c"):"
              git log -1 --format=%B "$c" | grep -Ein "$PATTERN" || true
              BAD=1
            fi
          done
          if [ "$BAD" = 1 ]; then
            echo "Reword those commits before merging (see AGENTS.md rule 11)."
            exit 1
          fi
          echo "checked $COUNT commit(s) in $RANGE: no session links"

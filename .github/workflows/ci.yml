name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -Dwarnings
    strategy:
      fail-fast: false
      matrix:
        # Windows (MSVC host) and Linux: platform/GPU crates must still compile on Linux (they report
        # "unsupported" at runtime there). GPU/window tests skip without a GPU and a desktop.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  android-check:
    # F6 (portable by design): every crate must at least type-check for a mobile ARM target, so
    # nothing quietly assumes Windows, x86 or a desktop. `cargo check` needs only the target's
    # std, not the Android NDK (nothing is linked).
    name: check (aarch64-linux-android)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Check
        run: cargo check --workspace --all-targets --target aarch64-linux-android

  windows-gnu:
    # The toolchain development uses: windows-gnu with the Rust toolchain's own linker and raw-dylib
    # imports (AGENTS.md rules 2–3). An env RUSTFLAGS replaces .cargo/config.toml rustflags, so the
    # link-self-contained flag is repeated here.
    name: test (windows-gnu, self-contained linker)
    runs-on: windows-latest
    env:
      RUSTFLAGS: -Dwarnings -C link-self-contained=yes
    steps:
      - uses: actions/checkout@v5
      - name: Install stable-x86_64-pc-windows-gnu
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component clippy
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  commit-messages:
    # This repository is public: session and share links (claude.ai or any other) don't belong in commit
    # messages. Only the commits this push or pull request adds are checked; history is left as it is.
    name: commit messages (no session links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check new commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # A push's own list of new commits: the fallback when its "before" commit is gone (force push).
          PUSHED: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail
          PATTERN='(https?://)?[^ ]*(claude\.ai/(code|chat|share)|chatgpt\.com/(c|share)/|chat\.openai\.com/(c|share)/|grok\.com/(chat|share)|gemini\.google\.com/(app|share)|g\.co/gemini/share|/session_0[0-9a-z]{20,})'
          git cat-file -e "$HEAD^{commit}"
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            RANGE="$BASE..$HEAD"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$PUSHED" != null ] && [ "$PUSHED" != "[]" ]; then
            # New branch or force push: the payload lists exactly the commits this push added.
            if printf '%s' "$PUSHED" | grep -Eiq "$PATTERN"; then
              echo "::error::session or share links in this push's commit messages:"
              printf '%s' "$PUSHED" | grep -Eio "$PATTERN" || true
              echo "Reword those commits (see AGENTS.md rule 11)."
              exit 1
            fi
            echo "checked the pushed commits from the event payload: no session links"
            exit 0
          else
            # A new branch with nothing listed: check what isn't on main yet.
            RANGE="$(git merge-base origin/main "$HEAD")..$HEAD"
          fi
          COUNT=$(git rev-list --count "$RANGE")
          BAD=0
          for c in $(git rev-list "$RANGE"); do
            if git log -1 --format=%B "$c" | grep -Eiq "$PATTERN"; then
              echo "::error::session or share link in commit $(git log -1 --format='%h %s' "$c"):"
              git log -1 --format=%B "$c" | grep -Ein "$PATTERN" || true
              BAD=1
            fi
          done
          if [ "$BAD" = 1 ]; then
            echo "Reword those commits before merging (see AGENTS.md rule 11)."
            exit 1
          fi
          echo "checked $COUNT commit(s) in $RANGE: no session links"

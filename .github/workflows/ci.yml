name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -Dwarnings
    strategy:
      fail-fast: false
      matrix:
        # Windows (MSVC host) and Linux: platform/GPU crates must still compile on Linux (they report
        # "unsupported" at runtime there). GPU/window tests skip without a GPU and a desktop.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  android-check:
    # F6 (portable by design): every crate must at least type-check for a mobile ARM target, so
    # nothing quietly assumes Windows, x86 or a desktop. `cargo check` needs only the target's
    # std, not the Android NDK (nothing is linked).
    name: check (aarch64-linux-android)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Check
        run: cargo check --workspace --all-targets --target aarch64-linux-android

  windows-gnu:
    # The toolchain development uses: windows-gnu with the Rust toolchain's own linker and raw-dylib
    # imports (AGENTS.md rules 2–3). An env RUSTFLAGS replaces .cargo/config.toml rustflags, so the
    # link-self-contained flag is repeated here.
    name: test (windows-gnu, self-contained linker)
    runs-on: windows-latest
    env:
      RUSTFLAGS: -Dwarnings -C link-self-contained=yes
    steps:
      - uses: actions/checkout@v5
      - name: Install stable-x86_64-pc-windows-gnu
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component clippy
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  commit-messages:
    # This repository is public: session and share links (claude.ai or any other) don't belong in commit
    # messages. Only the commits this push or pull request adds are checked; history is left as it is.
    name: commit messages (no session links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check new commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has no "before" commit: check only what isn't on main already.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base origin/main "$HEAD" 2>/dev/null || echo "")
          fi
          RANGE=${BASE:-$HEAD~1}..$HEAD
          PATTERN='https?://[^ ]*(claude\.ai/(code|chat|share)|chatgpt\.com/(c|share)/|grok\.com/(chat|share)|/session_[A-Za-z0-9]+)'
          FOUND=$(git log --format='%h %B' "$RANGE" | grep -En "$PATTERN" || true)
          if [ -n "$FOUND" ]; then
            echo "::error::session or share links in commit messages ($RANGE):"
            echo "$FOUND"
            echo "Reword those commits before merging (see AGENTS.md rule 11)."
            exit 1
          fi
          echo "checked $(git rev-list --count "$RANGE") commit(s) in $RANGE: no session links"

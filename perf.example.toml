# Specula performance budgets (foundation F3: the Intel iGPU is the reference device).
#
# Copy to `perf.toml` in the engine's working directory, or pass `--perf FILE`. Without either the
# engine checks only the built-in frame budget (16.67 ms) and pipelines built after warm-up.
# Every budget miss is reported by `perf_frame` (and in `perf_capture`'s summary) as a structured
# error: {error, metric, value, budget, unit, adapter}.
#
# Budgets are checked against: the latest frame's renderer statistics (GPU ms per pass, draw
# calls, triangles, GPU memory), the rolling p95 over the profiler's history (frame pacing, CPU
# frame, sim tick, game frame, allocations per frame, zones), and the current heap.
#
# Agents' tool calls run on the engine thread between frames, so a burst of sight_frame captures
# shows up in cpu_frame, allocations and "frame/requests": that is a real hitch in the window.
#
# These numbers are Sepulcra's (the tower defence) on the reference iGPU at 1280x720. Measured
# there on 2026-10-14 (Intel iGPU, window): GPU 4.0 ms mean (scene 2.3, shadow 0.25, bloom 0.53,
# tonemap 0.43, fxaa 0.42), CPU frame 0.15 ms p95, about 20 heap allocations per frame.

[profiler]
enabled = true          # CPU zones; measured overhead is far below 1% of a frame
history_frames = 120    # rolling window for p95s (about two seconds at 60 Hz)

# Defaults for every GPU. `[adapter.<kind>]` below overrides them per adapter kind
# (integrated, discrete, virtual, cpu, other), key by key.
[budgets]
frame_ms = 16.7                  # 60 fps
gpu_ms = 14.0                    # GPU time per frame, first pass start to last pass end
cpu_frame_ms = 8.0               # engine-thread work per frame, `present` (vsync wait) excluded; p95
frame_pacing_p95_ms = 20.9       # window frame to frame, p95 (above this, frames are being missed)
draw_calls = 400                 # instanced draw calls (shadow passes not included)
triangles = 1_500_000
gpu_memory_mb = 512              # what Specula's GPU allocator holds
heap_mb = 256                    # CPU heap in use (needs the counting allocator; the engine has it)
allocations_per_frame = 2_000    # heap allocations per frame, whole process, p95 (agents' sight_frame calls cost ~10k)
sim_tick_ms = 4.0                # one fixed simulation tick, p95
game_frame_ms = 2.0              # the game's per-frame update (input, camera, HUD), p95
pipelines_after_warm = 0         # each pipeline built during play is a visible hitch
# World limits, not frame budgets: set here only, never per adapter (a world must load the same on
# every machine). Vertices of distinct shape2d shapes (their upper bounds; identical shapes count
# once). Two pools, so effects a game spawns can never crowd out authored content: a refusal is a
# structured `limit` error naming the budget.
shape2d_vertices = 2_000_000           # persistent (saved) entities: what agents and people build
transient_shape2d_vertices = 250_000   # transient entities: effects and presentation a game spawns

[budgets.gpu_passes]             # GPU ms per pass
scene = 8.0
shadow = 2.5
ssao = 1.2                       # half resolution, 8 samples, both blurs: 0.66 ms at 1280x720 (2026-10-16)
post_bloom = 1.5
# Tone mapping now also applies the SSAO term and the colour grade (both added 2026-10-15, after
# the 0.43 ms above was measured): 0.80 ms p95 with the Sepulcra grade at 1280x720 (2026-10-16).
post_tonemap = 1.2
post_fxaa = 0.8

[budgets.zones]                  # CPU ms per frame (p95) per zone path; "thread:path" for other threads
"frame/requests" = 6.0           # agents' tool calls (sight_frame renders count here)
"frame/sim" = 4.0                # fixed ticks run this frame
"frame/sim/physics" = 2.0        # physics: sync, characters, step, write-back (PHYSICS.md: 1,000 awake bodies target)
"frame/game_frame" = 2.0
"frame/draw_list/sync_meshes" = 1.0   # lathe and model meshes uploaded for the window
"frame/draw_list" = 1.5           # building the window's draws (mesh sync included)
"frame/stream" = 3.0              # streaming: uploads ([streaming] upload_ms) plus the wanted-set update
"frame/autosave" = 2.0           # the engine thread's part of an autosave (the plan)
"specula-autosave:autosave.write" = 200.0   # the worker writing world files

# The reference device: Intel iGPU.
[adapter.integrated]
gpu_ms = 14.0

# A discrete GPU has no excuse: tighter GPU budgets, same CPU budgets.
[adapter.discrete]
gpu_ms = 6.0

[adapter.discrete.gpu_passes]
scene = 3.5
shadow = 1.0
ssao = 0.4
post_bloom = 0.6
post_tonemap = 0.2
post_fxaa = 0.3

# The window (`--max-fps N` overrides max_fps). A frame cap presents at most max_fps frames a second,
# on whole vblanks (60: every 4th at 240 Hz, every 3rd at 144 Hz); the GPU idles the rest of each
# period and agents' calls get it. On a laptop the iGPU shares its power and memory with the CPU and
# the desktop: at 240 Hz uncapped Sepulcra kept the iGPU ~60% busy and DWM composed every frame;
# capped at 60 the engine used ~30% and DWM half as much, and the GPU p95 fell from 10.4 to 6.3 ms
# (2026-10-22; perf/README.md, "M3 exit proof"). Off by default: every vblank.
# [window]
# max_fps = 60                  # 20-1000

# Swarm settings (the lead agent can also change frame_floor_fps live with swarm_settings, whose reply
# suggests a floor from this machine's hardware).
# [swarm]
# frame_floor_fps = 60          # 20-240: the window's minimum fps while agents keep calls queued
# lease_ports = [7500, 7599]    # ports lease_take {kind: "port"} hands out (never the engine's own)
# scratch_root = "scratch"      # where scratch-folder leases are made
# gpu_ms_per_s = 1000           # GPU time per second shared by GPU leases (advisory)

# Live Lex runs (lex_live): what they may spend, in deterministic work units (a Lex tick costs its work
# plus one per entity plus one), so steps land on the same engine ticks on every machine. One setting for
# every adapter.
# [lex_live]
# work_per_tick = 50000         # work all runs together may do per engine tick (about 3 ms on the iGPU laptop); a step that overspends is a debt the run pays back by pausing
# step_work = 250000            # work one Lex tick may do (about a frame; at most Lex's own cap of 5000000); past it the tick stops and the run halts
# backstop_ms = 1000            # wall time one Lex tick may take (not deterministic: a backstop only)

# Streaming (docs/design/STREAMING.md): model meshes and HLOD proxies upload within a per-frame budget
# and stay within a memory budget; perf_frame reports misses (stream_upload_over_budget,
# stream_upload_spike, stream_memory_over_budget). The lead agent can change these live with
# stream_settings. [streaming.integrated] etc. override per adapter kind. Defaults shown.
# [streaming]
# enabled = true          # off: every build uploads at once, no HLOD (the pre-streaming path)
# upload_ms = 2.0         # CPU ms of uploads per frame
# upload_mb = 8           # MB uploaded per frame
# memory_mb = 512         # GPU memory for streamed model meshes and proxies
# cell_m = 32             # streaming cell size
# radius_m = 384          # model entities load within this of a camera
# hlod = true             # merged proxies for far cells (the members' own coarsest LODs: no popping)
# hlod_min_m = 48         # no proxy nearer than this
# hlod_radius_m = 4096    # proxies load within this of a camera
# preload = 1.25          # members load at this times a proxied cell's switch distance
# settle_s = 1.0          # a changed cell's proxy is rebuilt after this quiet time
# capture_wait = true     # sight captures wait for what their view needs to be resident

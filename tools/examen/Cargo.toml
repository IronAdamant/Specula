[package]
name = "specula-examen"
description = "The repository's own tooling: the gate, the live checks' runner, and what a change needs verified"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "examen"
path = "src/main.rs"

[dependencies]
specula-core = { workspace = true }
# (For one thing: keeping this tool's own output handles from being inherited by an engine a
# command of it starts. Not the engine: the crate that declares kernel32.)
specula-sys = { workspace = true }

[lints]
workspace = true

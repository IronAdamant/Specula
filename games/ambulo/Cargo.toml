[package]
name = "ambulo"
description = "Example Specula game module: a capsule you can walk and jump with, hot-reloadable"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

# A module is a cdylib the engine loads (logic_build builds and reloads it). It depends on
# specula-sdk only, so editing it never recompiles the engine.
[lib]
crate-type = ["cdylib", "rlib"]

# The gameplay-module demo's tests link ambulo beside other modules; `linked` leaves out the
# exported entry point so several modules fit in one test binary (docs/design/GAMEPLAY_MODULES.md).
[features]
linked = []

[dependencies]
specula-sdk = { path = "../../crates/specula-sdk" }

[lints]
workspace = true

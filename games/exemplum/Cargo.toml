[package]
name = "exemplum"
description = "The Specula gameplay-module demo: a graveyard yard that uses inventory, abilities, dialogue and quests together"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
linked = []

[dependencies]
specula-sdk = { path = "../../crates/specula-sdk" }

# The demo's tests play the whole scene with every module linked into the engine's real module
# host (each module's `linked` feature leaves out its exported entry point).
[dev-dependencies]
specula = { path = "../../crates/specula" }
specula-logic = { path = "../../crates/specula-logic" }
specula-core = { path = "../../crates/specula-core" }
specula-audio = { path = "../../crates/specula-audio" }
ambulo = { path = "../ambulo", features = ["linked"] }
inventarium = { path = "../inventarium", features = ["linked"] }
facultas = { path = "../facultas", features = ["linked"] }
colloquium = { path = "../colloquium", features = ["linked"] }
quaestio = { path = "../quaestio", features = ["linked"] }

[lints]
workspace = true
